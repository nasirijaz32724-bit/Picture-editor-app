
<!DOCTYPE html>
<html>
<head>
    <title>Picture Editor App</title>
    <style>
body {
    text-align: center;
    font-family: Arial;
    margin-top: 40px;
}

h1 {
    font-size: 30px;
}

input {
    margin: 20px;
}

img {
    border-radius: 10px;
}
    </style>
</head>

<body>

<h1>Nasir Picture Editor</h1>

<p>Meri pehli app ban rahi hai</p>
<input type="file" accept="image/*">
  <img id="preview" width="300">

<script>
const input = document.querySelector('input');
const image = document.getElementById('preview');

input.onchange = function(){
    image.src = URL.createObjectURL(input.files[0]);
}
</script>  
    <br><br>

<label>Brightness:</label>
<input type="range" id="brightness" min="50" max="150" value="100">

<script>
const slider = document.getElementById("brightness");

slider.oninput = function(){
    image.style.filter = "brightness(" + slider.value + "%)";
}
</script>
    <br><br>

<button id="download">Download Picture</button>

<script>
const btn = document.getElementById("download");

btn.onclick = function(){
    const link = document.createElement("a");
    link.download = "edited-picture.png";
    link.href = image.src;
    link.click();
}
</script>
    <br><br>

<input type="text" id="textInput" placeholder="Photo par text likho">
<button onclick="addText()">Add Text</button>

<canvas id="canvas" width="300" height="300"></canvas>

<br><br>

<input type="text" id="textInput" placeholder="Photo par text likho">
<button onclick="addText()">Add Text</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function addText(){
    ctx.font = "30px Arial";
    ctx.fillText(
      document.getElementById("textInput").value,
      20,
      50
    );
}
</script>
</script>
</body>
</html>
